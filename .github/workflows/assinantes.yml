name: Gerar assinantes.json

on:
  pull_request:
    branches: [master]
    paths: ["assinaturas/**/*.asc", "assinantes.json"]
  push:
    branches: [master]
    paths: ["assinaturas/**/*.asc", "assinantes.json"]

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gerar assinantes.json
        run: |
          echo '[' > assinantes_tmp.json
          first=true
          for asc in assinaturas/*/*.asc; do
            [ -f "$asc" ] || continue
            # assinaturas/<bitdev_id>/<github_user>.asc
            bitdev_id=$(basename "$(dirname "$asc")")
            github_user=$(basename "$asc" .asc)

            # fingerprint da chave que assinou
            fp=$(gpg --list-packets "$asc" 2>/dev/null \
              | grep -oP 'keyid \K[A-F0-9]+' | head -1)

            if [ "$first" = true ]; then first=false; else echo ',' >> assinantes_tmp.json; fi
            cat >> assinantes_tmp.json <<EOF
          {
            "bitdev_id": "$bitdev_id",
            "github_user": "$github_user",
            "avatar": "https://github.com/$github_user.png",
            "github": "https://github.com/$github_user",
            "pgp_fingerprint": "$fp"
          }
          EOF
          done
          echo ']' >> assinantes_tmp.json

          jq '.' assinantes_tmp.json > assinantes.json
          rm -f assinantes_tmp.json

      - name: Commit assinantes.json
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assinantes.json
          git diff --cached --quiet || git commit -m "assinantes.json: atualizar"
          git push
